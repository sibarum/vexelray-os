# Tier A: bare-metal NVIDIA laptop. Ubuntu ships signed prebuilt modules,
# which keeps Secure Boot working without DKMS.
# Pin the driver branch deliberately; bump it in a commit, not implicitly.
[Content]
Packages=
        linux-modules-nvidia-570-generic
        nvidia-driver-570
        nvidia-utils-570
        libnvidia-gl-570
        nvidia-prime
KernelCommandLine=nvidia-drm.modeset=1 nvidia-drm.fbdev=1
