# vexelray-os base image: Ubuntu 24.04 LTS (noble).
# Profiles (mkosi --profile ...) layer on top: vm, nvidia, dev.
[Distribution]
Distribution=ubuntu
Release=noble

[Output]
Format=disk
ImageId=vexelray
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache

[Content]
Bootable=yes
Bootloader=systemd-boot
Autologin=yes
Hostname=vexelray
Locale=en_US.UTF-8
Timezone=UTC
KernelCommandLine=quiet splash
Packages=
        linux-image-generic
        linux-firmware
        systemd-sysv
        netplan.io
        network-manager
        openssh-server
        sudo
        vim-tiny
        less
        # Graphics: Mesa + Vulkan loader. lavapipe is the always-works fallback ICD.
        mesa-vulkan-drivers
        libvulkan1
        vulkan-tools
        mesa-utils
        libgl1-mesa-dri
        libdrm2
        # Wayland + audio base (compositor itself is built from ./compositor)
        libwayland-client0
        libwayland-server0
        wayland-utils
        xwayland
        pipewire
        wireplumber
        seatd
